<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* One column, phone-first, held by the advisor. Each step fills the screen; Next glides to the next one and earlier steps stay above. White, black, light grey. */
:root{
  --bg:#FFFFFF;
  --ink:#111111;
  --muted:#626262;
  --surface:#F3F3F3;
  --line:#E2E2E2;
  --chip:#FFFFFF;
  --display:"Cormorant Garamond",Garamond,Georgia,serif;
  --body:"Jost","Helvetica Neue",Arial,sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-weight:400;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{max-width:100%}

.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.mark{font-family:var(--display);font-size:14px;letter-spacing:.28em;white-space:nowrap}
.mark small{font-size:inherit;letter-spacing:.1em;text-transform:none}
.top-r{display:flex;align-items:center;gap:10px}
.count{font-family:var(--display);font-weight:500;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:4px}
.icon-btn{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{max-width:560px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.step{min-height:calc(100svh - var(--hh,66px));padding:28px 0 32px;display:flex;flex-direction:column}
.step.past{min-height:0;opacity:.45;transition:opacity .3s}
.step.past:hover,.step.past:focus-within{opacity:.8}
.num{display:flex;align-items:baseline;gap:8px}
.num b{font-family:var(--display);font-weight:500;font-size:80px;line-height:.85;font-variant-numeric:tabular-nums}
.num span{font-size:14px;font-weight:500;letter-spacing:.16em}
h1,h2{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:46px;line-height:1.05}
h2{font-size:40px;line-height:1.08;margin-top:18px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;border-radius:var(--r);background:var(--surface);padding:12px 14px;min-height:64px;transition:background .15s,color .15s}
.opt .ic{flex:0 0 42px;width:42px;height:42px;border-radius:21px;background:var(--chip);display:grid;place-items:center}
.opt .ic svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.opt .tx{flex:1;min-width:0}
.opt .l{display:block;font-size:17px;font-weight:500}
.opt .s{display:block;font-size:14px;color:var(--muted)}
.opt .ck{flex:0 0 26px;width:26px;height:26px;border-radius:13px;border:1.5px solid #BDBDBD;display:grid;place-items:center}
.opt .ck svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4;opacity:0}
.opt[aria-pressed="true"]{background:var(--ink);color:#fff}
.opt[aria-pressed="true"] .ic{background:#2A2A2A}
.opt[aria-pressed="true"] .ic svg{stroke:#fff}
.opt[aria-pressed="true"] .s{color:#CFCFCF}
.opt[aria-pressed="true"] .ck{border-color:#fff;background:#fff}
.opt[aria-pressed="true"] .ck svg{opacity:1;stroke:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 .opt{flex-direction:column;align-items:flex-start;min-height:150px;padding:14px;position:relative}
.grid2 .opt .ck{position:absolute;top:12px;right:12px}
.grid2 .opt .tx{display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.grid2 .opt .l{font-size:18px}

.go{margin-top:auto;padding-top:26px}
.btn{width:100%;height:60px;border-radius:30px;border:none;background:var(--ink);color:#fff;font-size:17px;font-weight:500;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled{background:#D6D6D6;color:#8A8A8A;cursor:default}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn.ghost{background:var(--surface);color:var(--ink)}
.step.past .go{display:none}

/* welcome */
.welcome h1{font-size:48px;margin-top:28px}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:30px}
.who .opt{justify-content:center;min-height:84px;font-size:20px}
.who .opt .l{font-size:20px}

/* house cues: text only */
.cues{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid var(--line)}
.cue{padding:18px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.cue .h{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.1}
.cue .r{font-size:16px;color:var(--muted)}
/* selection */
.sel-title{font-size:44px;margin-top:6px}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.card{border:none;background:var(--surface);border-radius:22px;padding:0;text-align:left;width:100%;overflow:hidden;display:flex;flex-direction:column}
.card .ph{position:relative;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
.card .ph img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain}
.card .n{position:absolute;top:12px;left:16px;font-family:var(--display);font-size:46px;line-height:1}
.card .tag{position:absolute;top:16px;right:14px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:999px;padding:5px 10px}
.card .meta{padding:0 18px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.card .nm{font-family:var(--display);font-weight:500;font-size:40px;line-height:1}
.card .fam{font-size:14px;color:var(--muted);margin-top:4px}
.card .arrow{flex:0 0 38px;width:38px;height:38px;border-radius:19px;background:var(--bg);display:grid;place-items:center}
.card .arrow svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2}
.c1{margin-top:20px}
.c1 .ph{height:300px;padding:34px 18px 10px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.duo .ph{height:190px;padding:40px 12px 8px}
.duo .n{font-size:34px}
.duo .nm{font-size:26px}
.duo .meta{padding:0 14px 14px}
.duo .arrow{display:none}
.ritual{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.ritual svg{flex:0 0 26px;width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.4}
.ritual b{font-weight:500}

.story-btn{margin-top:18px;width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:12px 14px;min-height:64px}
.story-btn .ic{flex:0 0 42px;width:42px;height:42px;border-radius:21px;background:var(--surface);display:grid;place-items:center}
.story-btn .ic svg,.story-btn .go-ic{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.story-btn .tx{flex:1;min-width:0}
.story-btn .l{display:block;font-family:var(--display);font-weight:500;font-size:24px;line-height:1.1}
.story-btn .s{display:block;font-size:14px;color:var(--muted)}
.sheet-top{display:flex;margin-bottom:18px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(20px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet .hero{background:var(--surface);border-radius:26px;height:360px;position:relative;display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden}
.sheet .hero img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain}
.sheet .hero .icon-btn{position:absolute;top:14px;left:14px;background:var(--bg);border:none}
.sheet .hero .n{position:absolute;top:16px;right:20px;font-family:var(--display);font-size:52px;line-height:1}
.sheet .fam{margin-top:22px}
.sheet .nm{font-family:var(--display);font-weight:500;font-size:62px;line-height:1;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500}
.why{margin-top:28px}
.why h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.why ul{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.why li{display:flex;gap:12px;align-items:flex-start}
.why .ok{flex:0 0 26px;width:26px;height:26px;border-radius:13px;background:var(--ink);display:grid;place-items:center;margin-top:1px}
.why .ok svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.6}
.why .a{display:block;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.why .f{display:block;font-size:17px;line-height:1.35}
.story{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
.story .t{font-family:var(--display);font-style:italic;font-size:24px;line-height:1.2;margin-top:6px}
.pyr{margin-top:22px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.pyr dt{color:var(--muted);font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.pyr dd{margin:0}

@media (max-width:370px){h2{font-size:31px}.num b{font-size:60px}.welcome h1{font-size:40px}.card .nm{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="mark">PARFUMS <small>de</small> MARLY</div>
  <div class="top-r">
    <div class="count" id="count" aria-live="polite"></div>
    <button class="icon-btn" id="restart" type="button" aria-label="New consultation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  </div>
</header>
<main id="flow"></main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Fragrance"><div class="in" id="sheetIn"></div></div>

<script>
const ICON={
check:'<path d="M5 12.5l4.2 4.2L19 7"/>',
arrow:'<path d="M12 5v14M6 13l6 6 6-6"/>',
next:'<path d="M5 12h14M13 6l6 6-6 6"/>',
back:'<path d="M15 5l-7 7 7 7"/>',
K1:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/>',
K2:'<path d="M12 20s-7-4.3-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.7-7 10-7 10z"/>',
A1:'<path d="M4 5h16v10H9l-5 4z"/><path d="M9 10h6"/>',
A2:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
A3:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>',
A4:'<path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h9"/>',
A5:'<path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/>',
S1:'<circle cx="9" cy="10" r="4.5"/><circle cx="16.5" cy="15.5" r="3"/><circle cx="16" cy="6" r="1.6"/>',
S2:'<circle cx="12" cy="7" r="3.5"/><circle cx="7" cy="12.5" r="3.5"/><circle cx="17" cy="12.5" r="3.5"/><circle cx="12" cy="17" r="3.5"/>',
S3:'<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/>',
S4:'<path d="M12 3c4 5.5 7 8.6 7 12.5A7 7 0 0 1 5 15.5c0-3 1.6-5 3-6.6.2 2.8 1.6 4.3 3 4.3 0-4-1-6.6 1-10.2z"/>',
S5:'<path d="M7 9h10l-1.2 11H8.2z"/><path d="M7 9a5 5 0 0 1 10 0"/><path d="M12 4V2.5"/>',
W1:'<path d="M4 12a8 8 0 0 1 13.7-5.6L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15"/><path d="M4 20v-5h5"/>',
W2:'<rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
W3:'<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>',
R1:'<path d="M12 4c3 4 5 6.6 5 9.2A5 5 0 0 1 7 13.2C7 10.6 9 8 12 4z"/>',
R2:'<path d="M5 9a7 7 0 0 1 14 0z"/><path d="M8 13v2M12 13v3M16 13v2M10 18v2M14 18v2"/>',
R3:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
house:'<path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
leaf:'<path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14z"/><path d="M5 19l8-8"/>',
quote:'<path d="M7 7h4v4c0 3-1.5 5-4 6M14 7h4v4c0 3-1.5 5-4 6"/>'
};
const svg=(k,cls='')=>`<svg viewBox="0 0 24 24" aria-hidden="true" ${cls}>${ICON[k]||''}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let D=null;
const S={gender:null,sel:{},reached:0};
const STEPS=['welcome','Q1','Q2','Q3','Q4','Q5','result'];
const MULTI={Q2:2,Q3:2};
const QNUM={Q1:1,Q2:2,Q3:3,Q4:4,Q5:5};

function ans(q){return D.answers.filter(a=>a.q===q)}
function chosen(q){return S.sel[q]||[]}
function isSel(id){return Object.values(S.sel).some(v=>v.includes(id))}

function pick(q,id){
  const max=MULTI[q]||1; let cur=chosen(q).slice();
  if(cur.includes(id)){ if(max>1) cur=cur.filter(x=>x!==id); }
  else { cur.push(id); if(cur.length>max) cur.shift(); }
  S.sel[q]=cur; refresh();
}

function score(p,i){
  if(!p.active) return -1;
  let s=0; for(const a of D.answers){ if(a.q==='Q1') continue; if(isSel(a.id)) s+=(p.aff[a.id]||0)*a.w; }
  return s*p.stock+(100-i)/1e6;
}
function trio(){
  const sc=D.perfumes.map((p,i)=>({p,s:score(p,i)})).filter(x=>x.s>=0);
  const pool=f=>sc.filter(f).sort((a,b)=>b.s-a.s);
  const F=pool(x=>x.p.gender==='Féminin'&&x.p.line==='Gamme'), M=pool(x=>x.p.gender==='Masculin'&&x.p.line==='Gamme'), X=pool(x=>x.p.line==='Extrait');
  let t;
  if(S.gender==='Woman') t=[F[0],F[1],X[0]];
  else { const ex=F[0]&&M[0]&&F[0].s>0&&F[0].s>=M[0].s*(1+(D.threshold??0.15)); t=[M[0],ex?F[0]:M[1],X[0]]; }
  return t.filter(Boolean).sort((a,b)=>b.s-a.s).map(x=>x.p);
}

function optBtn(q,a,grid){
  const on=chosen(q).includes(a.id);
  return `<button type="button" class="opt" aria-pressed="${on}" data-q="${q}" data-id="${a.id}">
    <span class="ic">${svg(a.id)}</span>
    <span class="tx"><span class="l">${esc(a.label)}</span>${a.sub?`<span class="s">${esc(a.sub)}</span>`:''}</span>
    <span class="ck">${svg('check')}</span></button>`;
}
function qSection(q){
  const Q=D.questions.find(x=>x.id===q), list=ans(q), grid=(q==='Q3');
  const ok=chosen(q).length>0, last=q==='Q5';
  return `<div class="num"><b>0${QNUM[q]}</b><span>/ 05</span></div>
    <h2>${esc(Q.text)}</h2>
    ${MULTI[q]?`<div class="hint">Up to ${MULTI[q]}</div>`:''}
    <div class="opts ${grid?'grid2':''}">${list.map(a=>optBtn(q,a,grid)).join('')}</div>
    <div class="go"><button type="button" class="btn" data-next="${q}" ${ok?'':'disabled'}>${last?'Discover the selection':'Next'} ${svg(last?'next':'arrow')}</button></div>`;
}
function welcome(){
  const g=['Woman','Man'];
  return `<div class="welcome"><div class="eyebrow">Fragrance consultation</div>
    <h1>Ready to start the consultation?</h1>
    <div class="who">${g.map(x=>`<button type="button" class="opt" aria-pressed="${S.gender===x}" data-gender="${x}"><span class="l">${x}</span></button>`).join('')}</div></div>
    <div class="go"><button type="button" class="btn" data-next="welcome" ${S.gender?'':'disabled'}>Let’s start ${svg('arrow')}</button></div>`;
}
function cueHTML(t){
  const parts=String(t).split(' · '), head=parts[0], rest=parts.slice(1).join(' · ');
  return `<li class="cue"><span class="h">${esc(head)}</span>${rest?`<span class="r">${esc(rest)}</span>`:''}</li>`;
}
function houseLevel(){return chosen('Q1')[0]==='K2'?'K2':'K1'}
function openHouse(){
  const lvl=houseLevel(), cues=D.house[lvl]||[]; lastFocus=document.activeElement;
  sheetIn.innerHTML=`<div class="sheet-top"><button type="button" class="icon-btn" data-close aria-label="Back to the selection">${svg('back')}</button></div>
    <div class="eyebrow">${lvl==='K2'?'Already knows the house':'Discovering the house'}</div>
    <h2>${lvl==='K2'?'Something new about the house':'Parfums de Marly'}</h2>
    <ul class="cues">${cues.map(cueHTML).join('')}</ul>
    <div class="go"><button type="button" class="btn ghost" data-close>Back to the selection</button></div>`;
  sheet.classList.add('open'); sheet.scrollTop=0; document.body.style.overflow='hidden';
  setTimeout(()=>sheetIn.querySelector('[data-close]').focus(),50);
}
const TITLE={W1:'Your signature',W2:'One for day, one for night',W3:'A wardrobe for every mood'};
function cardHTML(p,i,big){
  return `<button type="button" class="card ${big?'c1':''}" data-open="${p.id}" data-rank="${i+1}">
    <div class="ph"><span class="n">${i+1}</span>${p.line==='Extrait'?'<span class="tag">Les Extraits</span>':''}<img src="${esc(p.img)}" alt=""></div>
    <div class="meta"><div><div class="nm">${esc(p.name)}</div><div class="fam">${esc(p.family)}</div></div>${big?`<span class="arrow">${svg('next')}</span>`:''}</div></button>`;
}
function result(){
  const t=trio(), w=chosen('Q4')[0], r=chosen('Q5')[0];
  let rit='';
  if(r==='R2') rit=`<div class="ritual">${svg('R2')}<div><b>Showers in it</b> · suggest the larger size</div></div>`;
  if(r==='R3'){ const p=t.find(x=>x.ritual&&x.ritual!=='—'); rit=`<div class="ritual">${svg('R3')}<div><b>Full ritual</b> · ${p?esc(p.name)+': '+esc(p.ritual):'suggest the larger size'}</div></div>`; }
  return `<div class="eyebrow">The selection</div>
    <h1 class="sel-title">${esc(TITLE[w]||'Your selection')}</h1>
    <button type="button" class="story-btn" data-house><span class="ic">${svg('house')}</span><span class="tx"><span class="l">The House</span><span class="s">${houseLevel()==='K2'?'Something new to share':'The story of the house'}</span></span>${svg('next','class="go-ic"')}</button>
    ${t[0]?cardHTML(t[0],0,true):''}
    <div class="duo">${t.slice(1).map((p,i)=>cardHTML(p,i+1,false)).join('')}</div>
    ${rit}
    <div class="go"><button type="button" class="btn ghost" data-restart>New consultation ${svg('next')}</button></div>`;
}
function render(step){
  if(step==='welcome') return welcome();
  if(step==='result') return result();
  return qSection(step);
}

const flow=document.getElementById('flow');
function refresh(){
  STEPS.forEach((st,i)=>{
    const el=document.getElementById('st-'+st);
    if(i>S.reached){ if(el) el.remove(); return; }
    let sec=el; if(!sec){ sec=document.createElement('section'); sec.className='step'; sec.id='st-'+st; flow.appendChild(sec); }
    sec.classList.toggle('past',i<S.reached);
    sec.innerHTML=render(st);
  });
  const cur=STEPS[S.reached];
  document.getElementById('count').innerHTML=QNUM[cur]?`0${QNUM[cur]}<span>/ 05</span>`:'';
}
function advance(from){
  const i=STEPS.indexOf(from); if(i<S.reached) return;
  S.reached=i+1; refresh();
  const el=document.getElementById('st-'+STEPS[S.reached]);
  requestAnimationFrame(()=>{ const top=el.getBoundingClientRect().top+window.scrollY-headerH();
    window.scrollTo({top:Math.max(0,top),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); });
}
function restart(){ S.gender=null; S.sel={}; S.reached=0; closeSheet(); flow.innerHTML=''; refresh(); window.scrollTo({top:0}); }

// why-this-one facts
const FACT={
  A1:p=>`Signature: ${p.ingredient}`,
  A2:p=>okTxt(p.lvl2)?p.lvl2:`Signature: ${p.ingredient}`,
  A3:p=>`Dry-down: ${p.base}`,
  A4:p=>okTxt(p.lvl1)?p.lvl1:p.signature,
  A5:p=>/^\d{4}$/.test(p.year)?`Created in ${p.year}`:p.signature,
  S1:p=>`Opens with ${p.top}`, S3:p=>`Opens with ${p.top}`,
  S2:p=>`Heart: ${p.heart}`, S4:p=>`Dry-down: ${p.base}`, S5:p=>`Dry-down: ${p.base}`
};
function okTxt(t){return t&&!/to complete|à compléter/i.test(t)}
function whyLines(p){
  const L=D.answers.filter(a=>FACT[a.id]&&isSel(a.id)&&(p.aff[a.id]||0)>=2).sort((a,b)=>(p.aff[b.id]*b.w)-(p.aff[a.id]*a.w)).slice(0,3);
  if(!L.length) return `<li><span class="ok">${svg('check')}</span><span><span class="f">${esc(p.signature)}</span></span></li>`;
  return L.map(a=>`<li><span class="ok">${svg('check')}</span><span><span class="a">${esc(a.label)}</span><span class="f">${esc(FACT[a.id](p))}</span></span></li>`).join('');
}
const sheet=document.getElementById('sheet'), sheetIn=document.getElementById('sheetIn');
let lastFocus=null;
function openSheet(id,rank){
  const p=D.perfumes.find(x=>x.id===id); lastFocus=document.activeElement;
  const knows=chosen('Q1')[0]==='K2', story=knows?p.lvl2:p.lvl1;
  sheetIn.innerHTML=`<div class="hero"><button type="button" class="icon-btn" data-close aria-label="Back to the selection">${svg('back')}</button><span class="n">${rank}</span><img src="${esc(p.img)}" alt="${esc(p.name)} bottle"></div>
    <div class="eyebrow fam">${esc(p.family)}${p.line==='Extrait'?' · Les Extraits':''}</div>
    <div class="nm">${esc(p.name)}</div>
    <div class="chips">${String(p.words||'').split('·').map(w=>w.trim()).filter(Boolean).map(w=>`<span>${esc(w)}</span>`).join('')}</div>
    <div class="why"><h3>Why this one</h3><ul>${whyLines(p)}</ul></div>
    ${okTxt(story)?`<div class="story"><div class="eyebrow">${knows?'Did you know':'The story'}</div><div class="t">${esc(story)}</div></div>`:''}
    <dl class="pyr"><dt>Top</dt><dd>${esc(p.top)}</dd><dt>Heart</dt><dd>${esc(p.heart)}</dd><dt>Base</dt><dd>${esc(p.base)}</dd></dl>`;
  sheet.classList.add('open'); sheet.scrollTop=0; document.body.style.overflow='hidden';
  setTimeout(()=>sheetIn.querySelector('[data-close]').focus(),50);
}
function closeSheet(){ sheet.classList.remove('open'); document.body.style.overflow=''; if(lastFocus) lastFocus.focus(); }

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.gender){ S.gender=b.dataset.gender; refresh(); }
  else if(b.dataset.q){ pick(b.dataset.q,b.dataset.id); }
  else if(b.dataset.next){ advance(b.dataset.next); }
  else if(b.dataset.open){ openSheet(b.dataset.open,b.dataset.rank); }
  else if(b.hasAttribute('data-house')){ openHouse(); }
  else if(b.hasAttribute('data-close')){ closeSheet(); }
  else if(b.hasAttribute('data-restart')||b.id==='restart'){ restart(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheet.classList.contains('open')) closeSheet(); });

function headerH(){return document.querySelector('.top').getBoundingClientRect().height}
function setHH(){document.documentElement.style.setProperty('--hh',headerH()+'px')}
setHH(); addEventListener('resize',setHH);
fetch('data.json').then(r=>r.json()).then(d=>{D=d; refresh();}).catch(()=>{flow.innerHTML='<section class="step"><h2>The consultation could not load.</h2><p class="hint">Check your connection and reload the page.</p></section>';});
</script>
</body>
</html>
